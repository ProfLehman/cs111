<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-labelledby="title desc">
  <title id="title">NOT Gate</title>
  <desc id="desc">A standard NOT gate with input A and output R.</desc>
  <rect width="520" height="240" fill="white"/>
  <text x="35" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="black">A</text>
  <line x1="65" y1="120" x2="170" y2="120" stroke="black" stroke-width="4"/>
  <polygon points="170,70 170,170 280,120" fill="white" stroke="black" stroke-width="4"/>
  <circle cx="292" cy="120" r="10" fill="white" stroke="black" stroke-width="4"/>
  <line x1="302" y1="120" x2="425" y2="120" stroke="black" stroke-width="4"/>
  <text x="435" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="black">R</text>
  <text x="196" y="128" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="black">NOT</text>
</svg>
